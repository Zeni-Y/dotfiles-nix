<!-- hiraku の画像ビューア (全プレビュー共通の静的ページ)。
     ?src=view/<対象>/<ファイル> (/<セッション>/ からの相対) で対象を受ける。
     ブラウザのネイティブ表示をやめたのは、ウィンドウ幅に合わせて拡大
     ・縮小されるだけで「等倍で細部を見る」「全体を俯瞰する」の
     切り替えができず、大きい画像も小さい画像も見づらかったため。
     操作: 左クリックで拡大 / Ctrl + 左クリックで縮小 / 長押し (かドラッグ)
     で掴んで移動。倍率は常に右上に出す。
     拡大・縮小はカーソルの下の点を固定したまま行う (見ている場所が
     画面外に逃げないようにするため)。
     位置と倍率は sessionStorage に持つ。ファイルを保存し直すと親フレームが
     このページごと読み込み直すので、そのたびに全体表示へ戻ると
     「同じ場所を拡大したまま画像を作り直して見比べる」ができなくなる。 -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hiraku</title>
<style>
:root { color-scheme: light dark; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font-family: system-ui, sans-serif; }

#stage { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
body.grabbing #stage { cursor: grabbing; }
/* 市松模様。透過 PNG の透明部分を背景色と区別できるようにするため */
#stage { background-color: #8881;
  background-image: linear-gradient(45deg, #8882 25%, transparent 25%, transparent 75%, #8882 75%),
                    linear-gradient(45deg, #8882 25%, transparent 25%, transparent 75%, #8882 75%);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; }

#img { position: absolute; top: 0; left: 0; transform-origin: 0 0; max-width: none;
       user-select: none; -webkit-user-drag: none; }

#hud { position: fixed; top: .5rem; right: .5rem; display: flex; align-items: center; gap: .5rem;
       padding: .25em .6em; border-radius: 6px; font-size: .85rem;
       background: color-mix(in srgb, Canvas 80%, transparent); border: 1px solid #8886;
       backdrop-filter: blur(4px); }
#hud #size { opacity: .7; font-variant-numeric: tabular-nums; }
#zoom { padding: .1em .4em; border: 0; border-radius: 4px; background: none; color: inherit;
        font: inherit; font-variant-numeric: tabular-nums; font-weight: 600; cursor: pointer; }
#zoom:hover { background: #8883; }
#hint { position: fixed; left: .5rem; bottom: .5rem; padding: .25em .6em; border-radius: 6px;
        font-size: .8rem; opacity: .75; background: color-mix(in srgb, Canvas 80%, transparent);
        border: 1px solid #8886; transition: opacity .6s; }
#hint.gone { opacity: 0; pointer-events: none; }
#error { position: absolute; inset: 0; display: none; place-items: center; padding: 2rem; text-align: center; }
</style></head>
<body>
<div id="stage"><img id="img" alt="" draggable="false"></div>
<div id="hud"><span id="size"></span><button id="zoom" type="button" title="クリックで全体表示に戻す">—</button></div>
<div id="hint">左クリック: 拡大 / Ctrl + 左クリック: 縮小 / 長押しかドラッグ: 移動</div>
<div id="error"></div>

<script>
"use strict";

// 1 クリックあたりの倍率。1.25 だと細かすぎ、2 だと飛びすぎるので中間
var STEP = 1.5;
var MIN = 0.05, MAX = 32;
// これ以上動いたらクリックではなくドラッグ、これ以上押していたら長押し
var DRAG_PX = 4, HOLD_MS = 250;

var src = new URLSearchParams(location.search).get("src");
var stage = document.getElementById("stage");
var img = document.getElementById("img");
var zoomEl = document.getElementById("zoom");
var sizeEl = document.getElementById("size");
var hintEl = document.getElementById("hint");
var errEl = document.getElementById("error");

if (!src) { fail("?src=view/<対象>/<ファイル> の指定がない"); throw new Error("no src"); }
var name = decodeURIComponent(src.split("/").pop());
document.title = name;

function fail(msg) {
  errEl.textContent = msg;
  errEl.style.display = "grid";
  img.style.display = "none";
}

// scale は画像の実ピクセル基準 (100% = 等倍)。x, y は表示上の左上の位置
var view = { scale: 1, x: 0, y: 0 };
// ポートを複数のセッションで共有するので、パスだけだと別の対象の画像と
// 位置を取り違える。セッション (location.pathname) も鍵に混ぜる
var key = "hiraku.image:" + location.pathname + ":" + src;

function natural() {
  // SVG などで固有サイズを取れないことがある。0 のままだと割り算が壊れるので
  // ブラウザ既定の置換要素サイズ (300x150) を代わりに使う
  return { w: img.naturalWidth || 300, h: img.naturalHeight || 150 };
}

function fit() {
  var n = natural();
  var r = stage.getBoundingClientRect();
  // 小さい画像は引き伸ばさない。等倍を超える拡大は明示的なクリックに任せる
  return Math.min(1, r.width / n.w, r.height / n.h);
}

function clamp() {
  var n = natural();
  var r = stage.getBoundingClientRect();
  var w = n.w * view.scale, h = n.h * view.scale;
  // 画面に収まっているうちは中央に置き、はみ出したら端が内側に入らないようにする
  view.x = w <= r.width ? (r.width - w) / 2 : Math.min(0, Math.max(r.width - w, view.x));
  view.y = h <= r.height ? (r.height - h) / 2 : Math.min(0, Math.max(r.height - h, view.y));
}

function render() {
  clamp();
  img.style.transform = "translate(" + view.x + "px," + view.y + "px) scale(" + view.scale + ")";
  var pct = view.scale * 100;
  zoomEl.textContent = (pct < 10 ? pct.toFixed(1) : Math.round(pct)) + "%";
  try { sessionStorage.setItem(key, JSON.stringify(view)); } catch (e) { void e; }
}

function zoomAt(cx, cy, factor) {
  var next = Math.min(MAX, Math.max(MIN, view.scale * factor));
  if (next === view.scale) return;
  var r = stage.getBoundingClientRect();
  var px = cx - r.left, py = cy - r.top;
  // カーソルの下にある画像上の点を動かさない
  view.x = px - (px - view.x) * (next / view.scale);
  view.y = py - (py - view.y) * (next / view.scale);
  view.scale = next;
  render();
}

function reset() {
  view.scale = fit();
  render();
}

// ─── 読み込み ───

img.addEventListener("load", function () {
  var n = natural();
  sizeEl.textContent = n.w + " × " + n.h;
  var saved = null;
  try { saved = JSON.parse(sessionStorage.getItem(key) || "null"); } catch (e) { void e; }
  // 作り直された画像の寸法が変わっていることもあるので、位置は clamp に任せる
  if (saved && saved.scale > 0) view = saved;
  else view.scale = fit();
  render();
});
img.addEventListener("error", function () { fail("画像を読み込めない: " + name); });
img.src = src;

// ─── クリックで拡大・縮小、長押し/ドラッグで移動 ───

var drag = null;

stage.addEventListener("pointerdown", function (e) {
  if (e.button !== 0) return;
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false, held: false };
  drag.timer = setTimeout(function () {
    if (drag) { drag.held = true; document.body.classList.add("grabbing"); }
  }, HOLD_MS);
});

stage.addEventListener("pointermove", function (e) {
  if (!drag || e.pointerId !== drag.id) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < DRAG_PX) return;
  if (!drag.moved) { drag.moved = true; document.body.classList.add("grabbing"); }
  drag.x = e.clientX;
  drag.y = e.clientY;
  view.x += dx;
  view.y += dy;
  render();
});

function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  clearTimeout(drag.timer);
  var tap = !drag.moved && !drag.held;
  drag = null;
  document.body.classList.remove("grabbing");
  // 掴んで動かしたあとの指離しは拡大にしない (画像を置いただけのつもりなので)
  if (tap) zoomAt(e.clientX, e.clientY, e.ctrlKey ? 1 / STEP : STEP);
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
// Ctrl + クリックで右クリック扱いのメニューが出ると縮小が潰れる
stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

zoomEl.addEventListener("click", reset);
window.addEventListener("resize", render);

// 操作の説明は最初だけ出して、じきに消す (画像に重なり続けるため)
setTimeout(function () { hintEl.classList.add("gone"); }, 4000);
</script>
</body></html>
